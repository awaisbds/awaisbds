<!DOCTYPE html>
<html>

<head>

<title>The Hidden Corner</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(
180deg,
#020617,
#0f172a,
#111827
);
}

/* Stars */

.star{
position:absolute;
background:white;
border-radius:50%;
animation:twinkle 4s infinite;
}

@keyframes twinkle{

0%{
opacity:0.2;
transform:scale(1);
}

50%{
opacity:1;
transform:scale(1.5);
}

100%{
opacity:0.2;
transform:scale(1);
}

}

/* Blue glow */

.glow1{
position:absolute;
width:500px;
height:500px;
background:#2563eb;
border-radius:50%;
filter:blur(200px);
opacity:0.25;

top:-150px;
left:-150px;

animation:float1 10s infinite ease-in-out;
}

/* Purple glow */

.glow2{
position:absolute;
width:500px;
height:500px;
background:#7c3aed;
border-radius:50%;
filter:blur(200px);
opacity:0.25;

bottom:-150px;
right:-150px;

animation:float2 12s infinite ease-in-out;
}

@keyframes float1{

0%,100%{
transform:translate(0,0);
}

50%{
transform:translate(50px,30px);
}

}

@keyframes float2{

0%,100%{
transform:translate(0,0);
}

50%{
transform:translate(-50px,-30px);
}

}
  .card{

position:absolute;

top:50%;
left:50%;

transform:translate(-50%,-50%);

width:700px;
max-width:90%;

padding:40px;

background:rgba(255,255,255,0.05);

border:1px solid rgba(255,255,255,0.1);

border-radius:25px;

backdrop-filter:blur(12px);

box-shadow:
0 0 30px rgba(59,130,246,0.2);

text-align:center;

color:white;

animation:appear 1.5s ease;
}

@keyframes appear{

from{
opacity:0;
transform:translate(-50%,-40%);
}

to{
opacity:1;
transform:translate(-50%,-50%);
}

}

.card h1{

font-size:3rem;
margin-bottom:15px;

}

.subtitle{

color:#60a5fa;

font-weight:bold;

margin-bottom:20px;

letter-spacing:2px;

}

.line{

height:1px;

background:rgba(255,255,255,0.1);

margin:25px 0;

}

.text{

line-height:1.8;

color:#cbd5e1;

font-size:1.1rem;

}

</style>

</head>

<body>

<div class="glow1"></div>
<div class="glow2"></div>

<div class="star" style="top:10%;left:20%;width:3px;height:3px;"></div>
<div class="star" style="top:15%;left:70%;width:4px;height:4px;"></div>
<div class="star" style="top:25%;left:40%;width:2px;height:2px;"></div>
<div class="star" style="top:35%;left:80%;width:5px;height:5px;"></div>
<div class="star" style="top:45%;left:10%;width:3px;height:3px;"></div>
<div class="star" style="top:55%;left:60%;width:4px;height:4px;"></div>
<div class="star" style="top:65%;left:30%;width:2px;height:2px;"></div>
<div class="star" style="top:75%;left:90%;width:3px;height:3px;"></div>
<div class="star" style="top:85%;left:50%;width:4px;height:4px;"></div>
<div class="star" style="top:20%;left:90%;width:2px;height:2px;"></div>
<div class="star" style="top:60%;left:85%;width:3px;height:3px;"></div>
<div class="star" style="top:80%;left:15%;width:4px;height:4px;"></div>
  <div class="card">

<h1>🚪 THE HIDDEN CORNER</h1>

<p class="subtitle">
Access Level: Authorized
</p>

<div class="line"></div>

<p class="text">
Welcome, Agent Awais.

You have entered a hidden section of the internet.

Proceed with curiosity.
</p>

</div>

</body>

</html>
