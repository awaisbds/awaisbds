<!DOCTYPE html>
<html>
<head>
<title>Hidden Room</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card{
    background:rgba(255,255,255,0.05);
    padding:40px;
    border-radius:20px;
    text-align:center;
    width:600px;
    backdrop-filter:blur(10px);
    animation:float 3s ease-in-out infinite;
}

h1{
    font-size:3rem;
    margin-bottom:10px;
}

p{
    color:#cbd5e1;
    line-height:1.8;
}

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0px);}
}
</style>

</head>

<body>

<div class="card">

<h1>🚀 Agent Awais</h1>

<p>
If you're reading this, you've discovered a hidden corner of my website.
</p>

<p>
Mechanical Engineering student.
Curious builder.
Future creator.
Always learning something new.
</p>

<p>
Status: Exploring the internet one project at a time.
</p>

</div>

</body>
</html>
